<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSTSEM - 이메일 인증</title>
  <meta name="description" content="MUSTSEM 계정 이메일 인증을 처리하는 페이지입니다." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="canonical" href="https://www.mustsem.co.kr/confirm.html">
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MUSTSEM">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="MUSTSEM - 이메일 인증">
  <meta property="og:description" content="MUSTSEM 계정 이메일 인증을 처리하는 페이지입니다.">
  <meta property="og:url" content="https://www.mustsem.co.kr/confirm.html">
  <meta property="og:image" content="https://www.mustsem.co.kr/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Confirm page — scoped layout on top of the unified LIGHT system */
    .confirm-section { display: flex; justify-content: center; }
    .confirm-card { width: 100%; max-width: 460px; text-align: center; }

    /* Spinner (loading) — light track + teal head */
    .spinner {
      width: 56px; height: 56px;
      border: 3px solid var(--border-light);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Icon circle (success / error) */
    .icon-circle {
      width: 72px; height: 72px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .icon-circle.success { background: var(--accent-gradient); box-shadow: 0 8px 20px rgba(15, 30, 56, 0.10); }
    .icon-circle.error { background: linear-gradient(135deg, #ef4444, #f87171); box-shadow: 0 8px 32px rgba(239, 68, 68, 0.25); }
    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .icon-circle svg { width: 36px; height: 36px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    .confirm-title { font-size: 22px; font-weight: 700; color: var(--text-dark); margin-bottom: 12px; }
    .confirm-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 24px; }
    .countdown { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    .countdown span { color: var(--accent-primary); font-weight: 600; }
    .confirm-card .go-btn { margin-top: 4px; }
  </style>
</head>
<body class="page">
  <div id="site-nav"></div>

  <!-- Hero Section (compact dark subpage header) -->
  <section class="hero hero--subpage">
    <div class="hero-bg"></div>
    <div class="container hero-inner">
      <p class="eyebrow">계정</p>
      <h1>이메일 인증</h1>
      <p class="sub">MUSTSEM 계정 이메일 인증을 진행합니다.</p>
    </div>
  </section>

  <main>
    <section class="section confirm-section">
      <div class="container">
        <div class="card confirm-card">
          <div id="stateLoading">
            <div class="spinner"></div>
            <p class="confirm-title">인증 처리 중</p>
            <p class="confirm-desc">이메일 인증을 확인하고 있습니다.<br>잠시만 기다려 주세요.</p>
          </div>
          <div id="stateSuccess" style="display:none">
            <div class="icon-circle success">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <p class="confirm-title">인증 완료!</p>
            <p class="confirm-desc">이메일 인증이 성공적으로 완료되었습니다.<br>MUSTSEM Web3 인프라 플랫폼에 오신 것을 환영합니다.</p>
            <p class="countdown"><span id="countNum">3</span>초 후 로그인 페이지로 이동합니다.</p>
            <a href="login.html" class="btn primary go-btn">바로 로그인하기</a>
          </div>
          <div id="stateError" style="display:none">
            <div class="icon-circle error">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </div>
            <p class="confirm-title">인증 실패</p>
            <p class="confirm-desc" id="errorDesc">인증 링크가 만료되었거나 올바르지 않습니다.<br>다시 시도해 주세요.</p>
            <p class="countdown"><span id="errorCountNum">3</span>초 후 로그인 페이지로 이동합니다.</p>
            <a href="login.html" class="btn primary go-btn">로그인 페이지로</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="site.js"></script>
  <script src="script.js"></script>
  <script>
    function startCountdown(numId, seconds, dest) {
      const el = document.getElementById(numId);
      let count = seconds;
      const iv = setInterval(function() {
        count--;
        if (el) el.textContent = count;
        if (count <= 0) { clearInterval(iv); location.replace(dest); }
      }, 1000);
    }

    function showSuccess() {
      document.getElementById('stateLoading').style.display = 'none';
      document.getElementById('stateSuccess').style.display = 'block';
      startCountdown('countNum', 3, 'login.html');
    }

    function showError(msg) {
      document.getElementById('stateLoading').style.display = 'none';
      document.getElementById('stateError').style.display = 'block';
      if (msg) document.getElementById('errorDesc').textContent = msg;
      startCountdown('errorCountNum', 3, 'login.html');
    }

    async function handleConfirm() {
      // Supabase 접속 정보는 site.js의 공통 설정(MST_SUPABASE) 한 곳에서 관리된다
      let sb = null;
      try { sb = await window.mstSupabase(); } catch(e) { console.error('Supabase init failed:', e); }
      if (!sb) { showError('서비스 연결에 실패했습니다.'); return; }

      try {
        // Check for token in URL hash or query params (Supabase email confirm)
        const hash = window.location.hash;
        const params = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(hash.replace('#', ''));

        const type = hashParams.get('type') || params.get('type');
        const accessToken = hashParams.get('access_token') || params.get('access_token');
        const refreshToken = hashParams.get('refresh_token') || params.get('refresh_token');

        if (accessToken) {
          const { data, error } = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken || '' });
          if (error) { showError('인증 링크가 만료되었거나 올바르지 않습니다.'); return; }
          showSuccess();
          return;
        }

        // Check if already authenticated (redirect from Supabase)
        const { data: { session }, error } = await sb.auth.getSession();
        if (error) { showError('인증 처리 중 오류가 발생했습니다.'); return; }
        if (session) { showSuccess(); return; }

        showError('인증 링크가 올바르지 않습니다. 이메일의 링크를 다시 확인해주세요.');
      } catch(err) {
        console.error('Confirm error:', err);
        showError('인증 처리 중 오류가 발생했습니다.');
      }
    }

    handleConfirm();
  </script>
</body>
</html>
