<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSTSEM - 로그인</title>
  <meta name="description" content="MUSTSEM Web3 인프라 플랫폼 로그인 페이지입니다." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Login page — scoped layout on top of the unified LIGHT system */
    .auth-section { display: flex; justify-content: center; }
    .auth-card { width: 100%; max-width: 420px; }
    .auth-card .card-head { text-align: center; margin-bottom: 24px; }
    .auth-card .card-head h2 { margin: 0 0 8px; font-size: 22px; font-weight: 700; color: var(--text-dark); }
    .auth-card .card-head p { margin: 0; font-size: 14px; color: var(--text-secondary); }
    .auth-card .form { margin-top: 4px; }
    .auth-card .login-btn { width: 100%; margin-top: 4px; }
    .error-msg { text-align: center; color: #ef4444; font-size: 13px; margin-top: 4px; min-height: 20px; }
    .bottom-links { display: flex; justify-content: space-between; margin-top: 20px; font-size: 13px; }
    .bottom-links a { color: var(--text-secondary); }
    .bottom-links a:hover { color: var(--accent-primary); }
  </style>
</head>
<body class="page">
  <div id="site-nav"></div>

  <!-- Hero Section (compact dark subpage header) -->
  <section class="hero hero--subpage">
    <div class="hero-bg"></div>
    <div class="container hero-inner">
      <p class="eyebrow">계정</p>
      <h1>로그인</h1>
      <p class="sub">Web3 인프라 플랫폼에 다시 오신 것을 환영합니다.</p>
    </div>
  </section>

  <main>
    <section class="section auth-section">
      <div class="container">
        <div class="card auth-card">
          <div class="card-head">
            <h2>MUSTSEM 로그인</h2>
            <p>Web3 인프라 플랫폼 로그인</p>
          </div>
          <form id="loginForm" class="form">
            <div class="field">
              <label for="uid">이메일</label>
              <input type="email" id="uid" placeholder="이메일을 입력하세요" autocomplete="email" maxlength="100" required>
            </div>
            <div class="field">
              <label for="upw">비밀번호</label>
              <input type="password" id="upw" placeholder="비밀번호를 입력하세요" autocomplete="current-password" maxlength="50" required>
            </div>
            <button type="submit" class="btn primary login-btn">로그인</button>
            <div class="error-msg" id="errorMsg"></div>
          </form>
          <div class="bottom-links">
            <a href="signup.html">회원가입</a>
            <a href="index.html">홈으로 돌아가기</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="site.js"></script>
  <script src="script.js"></script>
  <script>
    // Supabase 접속 정보는 site.js의 공통 설정(MST_SUPABASE) 한 곳에서 관리된다
    let sb = null;
    const sbReady = window.mstSupabase()
      .then(client => { sb = client; return client; })
      .catch(e => { console.error('Supabase init failed:', e); return null; });

    sbReady.then(client => {
      if (client) client.auth.getSession().then(({ data: { session } }) => { if (session) location.replace('index.html'); });
    });

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = form.querySelector('.login-btn');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('uid').value.trim();
      const password = document.getElementById('upw').value;
      if (!email || !password) { errorMsg.style.color = '#ef4444'; errorMsg.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }
      loginBtn.disabled = true; loginBtn.textContent = '로그인 중...';
      if (!sb) await sbReady;
      if (!sb) { errorMsg.style.color = '#ef4444'; errorMsg.textContent = '서비스 연결에 실패했습니다.'; loginBtn.disabled = false; loginBtn.textContent = '로그인'; return; }
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        loginBtn.disabled = false; loginBtn.textContent = '로그인'; errorMsg.style.color = '#ef4444';
        if (error.message.includes('Invalid login')) errorMsg.textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
        else if (error.message.includes('Email not confirmed')) errorMsg.textContent = '이메일 인증이 완료되지 않았습니다.';
        else errorMsg.textContent = '로그인에 실패했습니다.';
      } else { errorMsg.style.color = '#10b981'; errorMsg.textContent = '로그인 성공!'; setTimeout(() => location.replace('index.html'), 500); }
    });
  </script>
</body>
</html>
