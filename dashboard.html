<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>대시보드 · Mustsem</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <meta name="description" content="MST 네트워크의 주요 지갑 잔액을 실시간으로 모니터링합니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Hero update-time line: lives on the DARK hero, so keep it light.
       Toned down from 45px cyan neon to the shared heading scale + teal accent. */
    .update-time-neo {
      margin-top: 20px;
      font-size: var(--title-banner);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--accent-secondary);
      opacity: 0;
      animation: dashFadeIn 1.4s ease-out forwards;
    }

    @keyframes dashFadeIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* 주소 흐림 처리 (크롤링/봇 방지) */
    .address-cell {
      filter: blur(5px);
      transition: filter 0.3s ease;
      cursor: pointer;
      user-select: none;
    }
    .address-cell:hover {
      filter: blur(0);
      user-select: text;
    }
    .address-cell::before {
      content: "🔒 ";
      filter: blur(0);
    }
    .address-cell:hover::before {
      content: "";
    }
    .address-hint {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 12px;
    }

  </style>
</head>

<body class="page">
  <div id="site-nav"></div>

<section class="hero hero--subpage">
  <div class="hero-bg"></div>
  <div class="container hero-inner">
    <p class="eyebrow">네트워크 대시보드</p>
    <h1>MST 네트워크 토큰 잔액 대시보드</h1>
    <p class="sub">MST 네트워크의 주요 지갑 잔액을 실시간 모니터링합니다.</p>
    <div id="updateTimeBig" class="update-time-neo"></div>
  </div>
</section>

  <main>
    <section class="section">
      <div class="container">
        <h2 class="section-title">MST 네이티브 토큰 잔액 대시보드</h2>
        <p class="lead">아래 표는 MST 네트워크의 주요 지갑 잔액을 실시간으로 표시합니다.</p>

        <div id="updateTime" style="margin-top:10px;color:var(--text-secondary); display:none;"></div>

        <div class="card" style="margin-top:24px;padding:0;overflow:hidden;">
          <table class="table">
            <thead>
              <tr>
                <th>구분</th>
                <th>주소</th>
                <th>잔액 (MST)</th>
              </tr>
            </thead>
            <tbody id="walletTable"></tbody>
          </table>
        </div>
        <p class="address-hint">* 보안을 위해 지갑 주소가 흐림 처리되어 있습니다. 마우스를 올리면 확인할 수 있습니다.</p>

        <div class="cta-row">
          <button type="button" class="btn primary" onclick="loadBalances()">새로고침</button>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="site.js"></script>
  <script src="script.js"></script>

  <script>
    async function loadBalances() {
      const res = await fetch("https://api.mst3.site/api/balances")
      const json = await res.json();

      const tbody = document.getElementById("walletTable");
      tbody.innerHTML = "";

      json.data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.label}</td>
          <td class="address-cell" title="마우스를 올리면 주소가 표시됩니다">${row.address}</td>
          <td>${row.balance.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });

      const formattedTime = new Date(json.updated).toLocaleString();
      const text = `⟳ 업데이트 시각: ${formattedTime}`;

      // [UPGRADE] 네온 스타일 영역 업데이트
      const updateElem = document.getElementById("updateTimeBig");
      updateElem.innerText = text;
      updateElem.style.animation = "none";      // 재실행 위해 초기화
      void updateElem.offsetWidth;              // 강제 리플로우
      updateElem.style.animation = "";          // 애니메이션 재적용
    }

    loadBalances();
  </script>
</body>
</html>
