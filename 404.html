<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 - 머스트셈 네트워크</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* 404 — scoped layout on top of the unified LIGHT system */
    .notfound-section { display: flex; justify-content: center; }
    .notfound-card { width: 100%; max-width: 480px; text-align: center; }
    .notfound-card h2 { margin: 0 0 8px; font-size: 22px; font-weight: 700; color: var(--text-dark); }
    .notfound-card p { margin: 0 0 24px; font-size: 14px; color: var(--text-secondary); line-height: 1.7; }
    .notfound-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body class="page">
  <div id="site-nav"></div>

  <!-- Hero Section (compact dark subpage header) -->
  <section class="hero hero--subpage">
    <div class="hero-bg"></div>
    <div class="container hero-inner">
      <p class="eyebrow">오류</p>
      <h1>404</h1>
      <p class="sub">요청하신 페이지를 찾을 수 없습니다.</p>
    </div>
  </section>

  <main>
    <section class="section notfound-section">
      <div class="container">
        <div class="card notfound-card">
          <h2>페이지를 찾을 수 없습니다</h2>
          <p>주소가 잘못 입력되었거나, 페이지가 이동 또는 삭제되었을 수 있습니다.<br>아래 버튼으로 계속 이용해주세요.</p>
          <div class="notfound-actions">
            <a href="/" class="btn primary">홈으로 이동</a>
            <a href="/network.html#apply" class="btn">문의하기</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="/site.js"></script>
  <script src="/script.js"></script>
</body>
</html>
