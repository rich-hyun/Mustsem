<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>대시보드 · Mustsem</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <meta name="description" content="MST 네트워크의 주요 지갑 잔액을 실시간으로 모니터링합니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Hero update-time line: lives on the DARK hero, so keep it light.
       Toned down from 45px cyan neon to the shared heading scale + teal accent. */
    .update-time-neo {
      margin-top: 20px;
      font-size: var(--title-banner);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--accent-secondary);
      opacity: 0;
      animation: dashFadeIn 1.4s ease-out forwards;
    }

    @keyframes dashFadeIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* 주소 흐림 처리 (크롤링/봇 방지) */
    .address-cell {
      filter: blur(5px);
      transition: filter 0.3s ease;
      cursor: pointer;
      user-select: none;
    }
    .address-cell:hover {
      filter: blur(0);
      user-select: text;
    }
    .address-hint {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 12px;
    }

  </style>
</head>

<body class="page">
  <div id="site-nav"></div>

<section class="hero hero--subpage">
  <div class="hero-bg"></div>
  <div class="container hero-inner">
    <p class="eyebrow">네트워크 대시보드</p>
    <h1>MST 네트워크 토큰 잔액 대시보드</h1>
    <p class="sub">MST 네트워크의 주요 지갑 잔액을 실시간 모니터링합니다.</p>
    <div id="updateTimeBig" class="update-time-neo"></div>
  </div>
</section>

  <main>
    <section class="section">
      <div class="container">
        <h2 class="section-title">MST 네이티브 토큰 잔액 대시보드</h2>
        <p class="lead">아래 표는 MST 네트워크의 주요 지갑 잔액을 실시간으로 표시합니다.</p>

        <div id="updateTime" style="margin-top:10px;color:var(--text-secondary); display:none;"></div>

        <div class="card" style="margin-top:24px;padding:0;overflow:hidden;">
          <table class="table">
            <thead>
              <tr>
                <th>구분</th>
                <th>주소</th>
                <th>잔액 (MST)</th>
              </tr>
            </thead>
            <tbody id="walletTable"></tbody>
          </table>
        </div>
        <p class="address-hint">* 보안을 위해 지갑 주소가 흐림 처리되어 있습니다. 마우스를 올리면 확인할 수 있습니다.</p>

        <div class="cta-row">
          <button type="button" class="btn primary" onclick="loadBalances()">새로고침</button>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="networks.js"></script>
  <script src="site.js"></script>
  <script src="script.js"></script>

  <script>
    let _loadingBalances = false;

    async function loadBalances() {
      if (_loadingBalances) return;          // 중복 요청 방지
      _loadingBalances = true;

      const tbody = document.getElementById("walletTable");
      const btn = document.querySelector(".cta-row .btn");
      // 표 전체 폭(3칸)에 걸친 상태 메시지 표시
      const stateRow = (html) => {
        tbody.innerHTML =
          `<tr><td colspan="3" style="text-align:center;padding:28px;color:var(--text-secondary);line-height:1.6">${html}</td></tr>`;
      };

      stateRow("불러오는 중…");
      if (btn) btn.disabled = true;

      try {
        const res = await fetch(`${MST_CONFIG.api}/api/balances`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        const rows = Array.isArray(json && json.data) ? json.data : [];

        if (rows.length === 0) {
          stateRow("표시할 잔액 데이터가 없습니다.");
        } else {
          tbody.innerHTML = "";
          rows.forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${row.label ?? "-"}</td>
              <td class="address-cell" title="마우스를 올리면 주소가 표시됩니다">${row.address ?? "-"}</td>
              <td>${Number(row.balance ?? 0).toLocaleString()}</td>
            `;
            tbody.appendChild(tr);
          });
        }

        // 업데이트 시각은 데이터 로드에 성공했을 때만 갱신
        if (json && json.updated) {
          const updateElem = document.getElementById("updateTimeBig");
          updateElem.innerText = `업데이트 시각: ${new Date(json.updated).toLocaleString()}`;
          updateElem.style.animation = "none";   // 재실행 위해 초기화
          void updateElem.offsetWidth;            // 강제 리플로우
          updateElem.style.animation = "";        // 애니메이션 재적용
        }
      } catch (err) {
        // 네트워크/서버/JSON 오류 → 빈 표 대신 명확한 안내 표시
        console.error("[dashboard] 잔액 로드 실패:", err);
        stateRow(
          "잔액 데이터를 불러오지 못했습니다.<br>" +
          `<span style="font-size:13px">API 서버(${MST_CONFIG.api.replace(/^https?:\/\//, "")})에 연결할 수 없습니다. ` +
          "잠시 후 <b>새로고침</b>을 눌러 다시 시도하세요.</span>"
        );
      } finally {
        _loadingBalances = false;
        if (btn) btn.disabled = false;
      }
    }

    loadBalances();
  </script>
</body>
</html>
